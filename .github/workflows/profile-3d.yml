name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Signal Flare 3D Contributions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/github-profile-3d-contrib.json

      - name: Post-process generated SVG
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          svg_path = Path("profile-3d-contrib/profile-signal-flare.svg")
          if not svg_path.exists():
              raise SystemExit("profile-signal-flare.svg was not generated.")

          SVG_NS = "http://www.w3.org/2000/svg"
          XLINK_NS = "http://www.w3.org/1999/xlink"
          ET.register_namespace("", SVG_NS)
          ET.register_namespace("xlink", XLINK_NS)

          tree = ET.parse(svg_path)
          root = tree.getroot()

          def num(val, default=0.0):
              if not val:
                  return default
              m = re.search(r"[-+]?[0-9]*\.?[0-9]+", str(val))
              return float(m.group()) if m else default

          viewbox = root.get("viewBox")
          if viewbox:
              parts = viewbox.strip().split()
              if len(parts) == 4:
                  _, _, W, H = map(float, parts)
              else:
                  W, H = 1280.0, 720.0
          else:
              W = num(root.get("width"), 1280.0)
              H = num(root.get("height"), 720.0)

          # Build parent map
          parent_map = {}
          for parent in root.iter():
              for child in list(parent):
                  parent_map[child] = parent

          def meta(elem):
              return " ".join([
                  elem.get("id", ""),
                  elem.get("class", ""),
              ]).lower()

          # 1) Remove elements whose id/class mentions star/fork
          remove_candidates = []
          for elem in root.iter():
              m = meta(elem)
              if "star" in m or "fork" in m:
                  remove_candidates.append(elem)

          for elem in remove_candidates:
              parent = parent_map.get(elem)
              if parent is not None and elem in list(parent):
                  parent.remove(elem)

          # 2) Fallback mask to hide remaining star/fork counters
          #    This keeps the contributions count on the left.
          mask_rect = ET.Element(f"{{{SVG_NS}}}rect", {
              "x": str(W * 0.56),
              "y": str(H * 0.90),
              "width": str(W * 0.24),
              "height": str(H * 0.09),
              "fill": "#0D0D0F"
          })
          root.append(mask_rect)

          # 3) Try to make contribution blocks look taller
          #    Applies only to likely calendar/contribution groups.
          scale_y = 1.35
          origin_y = H * 0.58
          translate_y = origin_y * (1 - scale_y)

          applied = False
          for elem in root.iter():
              m = meta(elem)
              if any(key in m for key in ["calendar", "contrib", "contribution", "3d", "grid"]):
                  if any(skip in m for skip in ["radar", "pie", "legend", "lang", "stats"]):
                      continue
                  current = elem.get("transform", "")
                  extra = f" translate(0 {translate_y:.2f}) scale(1 {scale_y})"
                  elem.set("transform", (current + extra).strip())
                  applied = True

          tree.write(svg_path, encoding="utf-8", xml_declaration=True)
          print("Post-processing complete.")
          print(f"Height exaggeration applied: {applied}")
          PY

      - name: Commit generated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "No contribution calendar changes."
          else
            git commit -m "Update 3D contribution calendar"
            git push
          fi