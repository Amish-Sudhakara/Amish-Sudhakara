name: Generate 3D Contribution Calendar

on:
  # runs every day at 00 : 30 UTC
  schedule:
    - cron: "30 0 * * *"
  # allow manual trigger from “Actions → Run workflow”
  workflow_dispatch:

permissions:
  contents: write   # needed for the auto-commit step

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Signal Flare 3D Contributions

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v5

      - name: 🛠️ Generate calendar SVG
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME:       ${{ github.repository_owner }}
          SETTING_JSON:   conf/github-profile-3d-contrib.json

      - name: 🧹 Post-process SVG (hide stars/forks, stretch cubes)
        run: |
          python <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          SVG_NS = "http://www.w3.org/2000/svg"
          ET.register_namespace("", SVG_NS)

          svg_file = Path("profile-3d-contrib/profile-signal-flare.svg")
          if not svg_file.exists():
              raise SystemExit("❌  SVG not generated – aborting post-process")

          tree = ET.parse(svg_file)
          root = tree.getroot()

          # ------------------------------------------------------------
          # Helper: build parent map so we can delete nodes cleanly
          parent_map = {c: p for p in root.iter() for c in p}

          # ------------------------------------------------------------
          # 1. Remove stars / forks footer completely
          for elem in list(root.iter()):
              txt = (elem.get("id", "") + elem.get("class", "")).lower()
              if any(key in txt for key in ("star", "fork")):
                  parent = parent_map.get(elem)
                  if parent is not None:
                      parent.remove(elem)

          # ------------------------------------------------------------
          # 2. Exaggerate cube height (scaleY = 2.5)
          scale_y = 2.5
          # calendar grid usually sits ~58 % down the canvas – we find bbox
          # fallback if <g id="contrib" …> exists, otherwise rough estimate
          contrib_groups = [g for g in root.iter() if "contrib" in (g.get("id","")+g.get("class","")).lower()]
          targets = contrib_groups or [root]  # fallback to whole root
          for g in targets:
              current = g.get("transform", "")
              # translate so scaling happens around the bottom of the cubes
              transform = f"{current} translate(0, -50) scale(1 {scale_y}) translate(0, 50)"
              g.set("transform", transform.strip())

          tree.write(svg_file, encoding="UTF-8", xml_declaration=True)
          print("✅  Post-processing completed")
          PY

      - name: 💾 Commit updated calendar (if it changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "ℹ️  No changes – nothing to commit"
          else
            git commit -m "Update 3D contribution calendar (taller cubes, no stars/forks)"
            git push
          fi