name: Generate 3D Contribution Calendar

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate Signal Flare 3D Contributions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate custom 3D contribution dashboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: |
          python <<'PY'
          import json
          import math
          import os
          import urllib.parse
          import urllib.request
          from datetime import date, timedelta
          from html import escape
          from pathlib import Path


          TOKEN = os.environ["GH_TOKEN"]
          USERNAME = os.environ["GH_USERNAME"]

          TODAY = date.today()
          FROM_DATE = TODAY - timedelta(days=364)


          # ------------------------------------------------------------
          # GitHub helpers
          # ------------------------------------------------------------

          def gh_rest(url: str):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "signal-flare-3d-dashboard",
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return json.load(resp)

          def gh_graphql(query: str, variables: dict):
              payload = json.dumps(
                  {"query": query, "variables": variables}
              ).encode("utf-8")

              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Content-Type": "application/json",
                      "User-Agent": "signal-flare-3d-dashboard",
                  },
                  method="POST",
              )

              with urllib.request.urlopen(req, timeout=60) as resp:
                  data = json.load(resp)

              if data.get("errors"):
                  raise RuntimeError(json.dumps(data["errors"], indent=2))

              return data["data"]

          def gh_rest_paged(base_url: str):
              items = []
              page = 1
              while True:
                  sep = "&" if "?" in base_url else "?"
                  url = f"{base_url}{sep}per_page=100&page={page}"
                  data = gh_rest(url)
                  if not isinstance(data, list) or not data:
                      break
                  items.extend(data)
                  if len(data) < 100:
                      break
                  page += 1
              return items

          def search_total(query: str, fallback=0):
              try:
                  url = (
                      "https://api.github.com/search/issues?q="
                      + urllib.parse.quote(query)
                  )
                  data = gh_rest(url)
                  return int(data.get("total_count", fallback))
              except Exception:
                  return fallback


          # ------------------------------------------------------------
          # Fetch contribution calendar
          # ------------------------------------------------------------

          contributions_query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                      weekday
                    }
                  }
                }
              }
            }
          }
          """

          contrib_data = gh_graphql(
              contributions_query,
              {
                  "login": USERNAME,
                  "from": f"{FROM_DATE.isoformat()}T00:00:00Z",
                  "to": f"{TODAY.isoformat()}T23:59:59Z",
              },
          )

          user = contrib_data["user"]
          calendar = user["contributionsCollection"]["contributionCalendar"]
          weeks = calendar["weeks"]
          total_contributions = int(calendar["totalContributions"])

          days = [
              d
              for week in weeks
              for d in week["contributionDays"]
          ]

          max_count = max(
              (int(d["contributionCount"]) for d in days),
              default=1,
          )


          # ------------------------------------------------------------
          # Fetch repo / language / stars / forks data
          # ------------------------------------------------------------

          repos = gh_rest_paged(
              f"https://api.github.com/users/{USERNAME}/repos?type=owner&sort=updated"
          )

          owned_repos = [r for r in repos if not r.get("fork", False)]
          repo_count = len(owned_repos)
          total_stars = sum(int(r.get("stargazers_count", 0)) for r in owned_repos)
          total_forks = sum(int(r.get("forks_count", 0)) for r in owned_repos)

          language_weights = {}
          for repo in owned_repos:
              lang = repo.get("language") or "Other"
              weight = max(int(repo.get("size", 0)), 1)
              language_weights[lang] = language_weights.get(lang, 0) + weight

          top_languages = sorted(
              language_weights.items(),
              key=lambda x: x[1],
              reverse=True,
          )

          main_langs = top_languages[:3]
          other_weight = sum(w for _, w in top_languages[3:])

          lang_data = []
          for name, weight in main_langs:
              lang_data.append((name, weight))
          if other_weight > 0 or not lang_data:
              lang_data.append(("other", other_weight if other_weight > 0 else 1))


          # ------------------------------------------------------------
          # Fetch activity metrics for radar chart
          # ------------------------------------------------------------

          since_str = FROM_DATE.isoformat()

          issue_count = search_total(
              f"author:{USERNAME} type:issue created:>={since_str}",
              fallback=0,
          )
          pr_count = search_total(
              f"author:{USERNAME} type:pr created:>={since_str}",
              fallback=0,
          )
          review_count = search_total(
              f"reviewed-by:{USERNAME} type:pr updated:>={since_str}",
              fallback=0,
          )
          commit_count = total_contributions

          radar_metrics = [
              ("Commit", commit_count),
              ("Issue", issue_count),
              ("PullReq", pr_count),
              ("Review", review_count),
              ("Repo", repo_count),
          ]


          # ------------------------------------------------------------
          # Theme
          # ------------------------------------------------------------

          BG = "#0D0D0F"
          BG_PANEL = "#111114"
          GRID_EMPTY_TOP = "#19191D"

          EMPTY_TOP = "#18191E"

          CONTRIBUTION_COLORS = [
              ("#4A2415", "#2D160D", "#381B10"),
              ("#873514", "#51200C", "#67280F"),
              ("#FF4F00", "#982F00", "#C23C00"),
              ("#D8FF3E", "#819925", "#A4C22F"),
          ]

          TEXT = "#F2EBDD"
          MUTED = "#B7B1A6"
          GRID_LINE = "#6E6A72"
          RADAR = "#D8FF3E"
          ORANGE = "#FF4F00"
          BLUE = "#3776AB"
          NOTEBOOK = "#F37726"
          HTML = "#E34F26"
          OTHER = "#4A4A4A"


          def lang_color(name: str):
              key = name.lower()
              if key == "python":
                  return BLUE
              if key == "jupyter notebook":
                  return NOTEBOOK
              if key == "html":
                  return HTML
              if key == "other":
                  return OTHER

              fallback_palette = [
                  BLUE,
                  NOTEBOOK,
                  HTML,
                  "#8B5CF6",
                  "#10B981",
                  "#14B8A6",
                  "#A3A3A3",
              ]
              idx = abs(hash(name)) % len(fallback_palette)
              return fallback_palette[idx]


          # ------------------------------------------------------------
          # Layout
          # ------------------------------------------------------------

          WIDTH = 1280
          HEIGHT = 760

          TILE_W = 30
          TILE_H = 16

          ORIGIN_X = 112
          ORIGIN_Y = 62


          # ------------------------------------------------------------
          # Geometry helpers
          # ------------------------------------------------------------

          def contribution_level(count: int) -> int:
              if count <= 0:
                  return 0
              ratio = math.log1p(count) / math.log1p(max_count)
              if ratio < 0.28:
                  return 1
              if ratio < 0.52:
                  return 2
              if ratio < 0.76:
                  return 3
              return 4

          def block_height(count: int) -> float:
              if count <= 0:
                  return 0.0
              ratio = math.log1p(count) / math.log1p(max_count)
              return 18.0 + ((ratio ** 1.28) * 125.0)

          def iso_pos(week_index: int, weekday: int):
              x = ORIGIN_X + (week_index - weekday) * (TILE_W / 2)
              y = ORIGIN_Y + (week_index + weekday) * (TILE_H / 2)
              return x, y

          def points_str(points):
              return " ".join(f"{x:.1f},{y:.1f}" for x, y in points)

          def polar(cx, cy, r, angle_deg):
              a = math.radians(angle_deg - 90)
              return (cx + r * math.cos(a), cy + r * math.sin(a))

          def donut_arc_path(cx, cy, r_outer, r_inner, start_deg, end_deg):
              start_outer = polar(cx, cy, r_outer, start_deg)
              end_outer = polar(cx, cy, r_outer, end_deg)
              start_inner = polar(cx, cy, r_inner, end_deg)
              end_inner = polar(cx, cy, r_inner, start_deg)

              large_arc = 1 if abs(end_deg - start_deg) > 180 else 0

              return (
                  f"M {start_outer[0]:.2f} {start_outer[1]:.2f} "
                  f"A {r_outer:.2f} {r_outer:.2f} 0 {large_arc} 1 {end_outer[0]:.2f} {end_outer[1]:.2f} "
                  f"L {start_inner[0]:.2f} {start_inner[1]:.2f} "
                  f"A {r_inner:.2f} {r_inner:.2f} 0 {large_arc} 0 {end_inner[0]:.2f} {end_inner[1]:.2f} Z"
              )

          def fmt_num(n: int) -> str:
              return f"{n:,}"


          # ------------------------------------------------------------
          # Build calendar cells
          # ------------------------------------------------------------

          cells = []
          for week_idx, week in enumerate(weeks):
              for day in week["contributionDays"]:
                  weekday = int(day["weekday"])
                  count = int(day["contributionCount"])
                  x, y = iso_pos(week_idx, weekday)
                  cells.append(
                      (
                          week_idx + weekday,
                          week_idx,
                          weekday,
                          x,
                          y,
                          count,
                          day["date"],
                      )
                  )

          cells.sort(key=lambda item: (item[0], item[1], item[2]))


          # ------------------------------------------------------------
          # Start SVG
          # ------------------------------------------------------------

          svg = []
          svg.append('<?xml version="1.0" encoding="UTF-8"?>')
          svg.append(
              f'<svg xmlns="http://www.w3.org/2000/svg" '
              f'width="{WIDTH}" height="{HEIGHT}" viewBox="0 0 {WIDTH} {HEIGHT}" '
              f'role="img" aria-label="{escape(USERNAME)} GitHub contribution dashboard">'
          )

          svg.append(f'<rect width="100%" height="100%" fill="{BG}"/>')

          svg.append(
              f'''
              <defs>
                <filter id="shadow" x="-25%" y="-25%" width="160%" height="160%">
                  <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.45"/>
                </filter>
                <filter id="softShadow" x="-25%" y="-25%" width="160%" height="160%">
                  <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.28"/>
                </filter>
              </defs>
              '''
          )


          # ------------------------------------------------------------
          # Calendar
          # ------------------------------------------------------------

          svg.append('<g filter="url(#shadow)">')

          for _, _, _, x, y, count, contribution_date in cells:
              level = contribution_level(count)
              height = block_height(count)

              bottom = [
                  (x, y),
                  (x + TILE_W / 2, y + TILE_H / 2),
                  (x, y + TILE_H),
                  (x - TILE_W / 2, y + TILE_H / 2),
              ]

              if level == 0:
                  svg.append(
                      f'<polygon points="{points_str(bottom)}" fill="{EMPTY_TOP}" opacity="0.95"/>'
                  )
                  continue

              top = [(px, py - height) for px, py in bottom]
              left_side = [top[3], top[2], bottom[2], bottom[3]]
              right_side = [top[1], top[2], bottom[2], bottom[1]]

              top_color, left_color, right_color = CONTRIBUTION_COLORS[level - 1]

              svg.append("<g>")
              svg.append(f"<title>{escape(contribution_date)}: {count} contributions</title>")
              svg.append(f'<polygon points="{points_str(left_side)}" fill="{left_color}"/>')
              svg.append(f'<polygon points="{points_str(right_side)}" fill="{right_color}"/>')
              svg.append(f'<polygon points="{points_str(top)}" fill="{top_color}"/>')
              svg.append("</g>")

          svg.append("</g>")


          # ------------------------------------------------------------
          # Radar chart
          # ------------------------------------------------------------

          radar_cx = 975
          radar_cy = 165
          radar_r = 105

          svg.append('<g filter="url(#softShadow)">')

          ring_levels = 5
          for i in range(1, ring_levels + 1):
              r = radar_r * (i / ring_levels)
              ring_points = [polar(radar_cx, radar_cy, r, angle) for angle in [0, 72, 144, 216, 288]]
              svg.append(
                  f'<polygon points="{points_str(ring_points)}" fill="none" stroke="{GRID_LINE}" stroke-width="1" stroke-dasharray="4 4" opacity="0.85"/>'
              )

          axis_angles = [0, 72, 144, 216, 288]
          labels = ["Commit", "Issue", "PullReq", "Review", "Repo"]

          for angle, label in zip(axis_angles, labels):
              x1, y1 = polar(radar_cx, radar_cy, 0, angle)
              x2, y2 = polar(radar_cx, radar_cy, radar_r, angle)
              lx, ly = polar(radar_cx, radar_cy, radar_r + 28, angle)

              svg.append(
                  f'<line x1="{x1:.1f}" y1="{y1:.1f}" x2="{x2:.1f}" y2="{y2:.1f}" stroke="{GRID_LINE}" stroke-width="1" stroke-dasharray="4 4" opacity="0.8"/>'
              )
              svg.append(
                  f'<text x="{lx:.1f}" y="{ly:.1f}" fill="{TEXT}" font-family="monospace" font-size="18" text-anchor="middle" dominant-baseline="middle">{label}</text>'
              )

          ring_text = ["0", "10", "100", "1K", "10K"]
          for idx, t in enumerate(ring_text):
              ty = radar_cy - (radar_r * (idx + 1) / ring_levels)
              tx = radar_cx + 6
              svg.append(
                  f'<text x="{tx:.1f}" y="{ty:.1f}" fill="{MUTED}" font-family="monospace" font-size="14">{t}</text>'
              )

          def radar_scale(value):
              if value <= 0:
                  return 0.08
              max_visual = 10000.0
              return min(1.0, math.log10(value + 1) / math.log10(max_visual + 1))

          radar_points = []
          for angle, (_, value) in zip(axis_angles, radar_metrics):
              rr = radar_r * radar_scale(value)
              radar_points.append(polar(radar_cx, radar_cy, rr, angle))

          svg.append(
              f'<polygon points="{points_str(radar_points)}" fill="{RADAR}" fill-opacity="0.55" stroke="{RADAR}" stroke-width="3"/>'
          )

          svg.append("</g>")


          # ------------------------------------------------------------
          # Donut chart + legend
          # ------------------------------------------------------------

          donut_cx = 125
          donut_cy = 560
          r_outer = 78
          r_inner = 40

          total_lang_weight = sum(weight for _, weight in lang_data) or 1
          start_angle = -90.0

          svg.append('<g filter="url(#softShadow)">')

          for name, weight in lang_data:
              frac = weight / total_lang_weight
              end_angle = start_angle + (frac * 360.0)
              color = lang_color(name)
              path = donut_arc_path(donut_cx, donut_cy, r_outer, r_inner, start_angle, end_angle)
              svg.append(f'<path d="{path}" fill="{color}"/>')
              start_angle = end_angle

          # donut hole
          svg.append(f'<circle cx="{donut_cx}" cy="{donut_cy}" r="{r_inner-1}" fill="{BG}"/>')

          legend_x = 295
          legend_y = 505
          legend_gap = 42

          for i, (name, _) in enumerate(lang_data):
              label = name if name != "other" else "other"
              color = lang_color(name)
              y = legend_y + (i * legend_gap)

              svg.append(f'<rect x="{legend_x}" y="{y-14}" width="20" height="20" fill="{color}"/>')
              svg.append(
                  f'<text x="{legend_x + 28}" y="{y+2}" fill="{TEXT}" font-family="Arial, sans-serif" font-size="22">{escape(label)}</text>'
              )

          svg.append("</g>")


          # ------------------------------------------------------------
          # Footer summary
          # ------------------------------------------------------------

          # bottom accent line
          svg.append(
              f'''
              <path d="M 0 {HEIGHT-10} L 0 {HEIGHT-4} L {WIDTH} {HEIGHT-4} L {WIDTH} {HEIGHT-10}"
                    fill="#10141D"/>
              '''
          )

          footer_y = 655

          # contributions
          svg.append(
              f'<text x="330" y="{footer_y}" fill="{ORANGE}" font-family="Arial, sans-serif" font-size="26" font-weight="700">{fmt_num(total_contributions)}</text>'
          )
          svg.append(
              f'<text x="386" y="{footer_y}" fill="{TEXT}" font-family="Arial, sans-serif" font-size="22">contributions</text>'
          )

          # star icon
          star_x = 605
          star_y = footer_y - 8
          star_points = []
          outer_r = 12
          inner_r = 5.2
          for i in range(10):
              ang = -90 + i * 36
              r = outer_r if i % 2 == 0 else inner_r
              px = star_x + r * math.cos(math.radians(ang))
              py = star_y + r * math.sin(math.radians(ang))
              star_points.append((px, py))
          svg.append(
              f'<polygon points="{points_str(star_points)}" fill="none" stroke="{TEXT}" stroke-width="2"/>'
          )
          svg.append(
              f'<text x="626" y="{footer_y}" fill="{TEXT}" font-family="Arial, sans-serif" font-size="22" font-weight="700">{fmt_num(total_stars)}</text>'
          )

          # fork icon
          fx = 720
          fy = footer_y - 8
          svg.append(f'<circle cx="{fx}" cy="{fy-10}" r="4" fill="{TEXT}"/>')
          svg.append(f'<circle cx="{fx-10}" cy="{fy+8}" r="4" fill="{TEXT}"/>')
          svg.append(f'<circle cx="{fx+10}" cy="{fy+8}" r="4" fill="{TEXT}"/>')
          svg.append(f'<line x1="{fx}" y1="{fy-6}" x2="{fx}" y2="{fy+2}" stroke="{TEXT}" stroke-width="2"/>')
          svg.append(f'<line x1="{fx}" y1="{fy+1}" x2="{fx-10}" y2="{fy+6}" stroke="{TEXT}" stroke-width="2"/>')
          svg.append(f'<line x1="{fx}" y1="{fy+1}" x2="{fx+10}" y2="{fy+6}" stroke="{TEXT}" stroke-width="2"/>')
          svg.append(
              f'<text x="740" y="{footer_y}" fill="{TEXT}" font-family="Arial, sans-serif" font-size="22" font-weight="700">{fmt_num(total_forks)}</text>'
          )

          svg.append("</svg>")


          # ------------------------------------------------------------
          # Save
          # ------------------------------------------------------------

          output_file = Path("profile-3d-contrib/profile-signal-flare.svg")
          output_file.parent.mkdir(parents=True, exist_ok=True)
          output_file.write_text("\n".join(svg), encoding="utf-8")

          print(f"Generated {output_file}")
          print(f"Total contributions: {total_contributions}")
          print(f"Repo count: {repo_count}, Stars: {total_stars}, Forks: {total_forks}")
          PY

      - name: Commit generated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-3d-contrib/profile-signal-flare.svg

          if git diff --cached --quiet; then
            echo "No contribution calendar changes."
          else
            git commit -m "Update 3D contribution calendar"
            git push
          fi